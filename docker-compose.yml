services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: visionretail_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-visionretail}
      POSTGRES_USER:     ${POSTGRES_USER:-visionretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionretail_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionretail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionretail_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visionretail}:${POSTGRES_PASSWORD:-visionretail_secret}@db:5432/${POSTGRES_DB:-visionretail}
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend          # FastAPI app + alembic
      - ./pipeline:/app/pipeline        # CV pipeline (root-level)
      - ./ai:/app/ai                    # LLM client + prompts + retrieval
      - ./datasets:/app/datasets        # Raw + processed data
      - ./models:/app/models            # YOLOv8m + OSNet weights
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cd /app/backend &&
             alembic upgrade head &&
             python seed_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop asyncio"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Vite / React frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points browser-side fetch() to the publicly exposed API port
        VITE_API_BASE_URL: http://localhost:8000
    container_name: visionretail_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ── Detection Pipeline ─────────────────────────────────────────────────────
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionretail_pipeline
    restart: "no"
    env_file: .env
    environment:
      API_URL: http://api:8000
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend          # FastAPI app + alembic
      - ./pipeline:/app/pipeline        # CV pipeline (root-level)
      - ./datasets:/app/datasets        # Raw + processed data
      - ./models:/app/models            # YOLOv8m + OSNet weights
    depends_on:
      api:
        condition: service_healthy
    command: >
      bash /app/pipeline/run.sh


volumes:
  postgres_data:
    driver: local
